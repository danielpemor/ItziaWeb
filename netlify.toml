# Netlify build + serverless function config.
# The Astro app lives in astro-frontend/. Paths below are relative to `base`.
# If your Netlify dashboard already sets a different base directory, make it
# match "astro-frontend" (or remove the dashboard override so this file wins).
[build]
  base = "astro-frontend"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Clean URL for the contact endpoint: /api/contact → the function.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
